version: 2

updates:
  # The package ships zero runtime dependencies, so this only ever touches the
  # toolchain: typescript, vitest, oxlint and @types/node.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]

  # Action versions are pinned by major tag; a weekly check keeps the pin from
  # silently going stale between releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
